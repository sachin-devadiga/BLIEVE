services:
  - type: web
    name: blieve-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        value: president@blieve.in
      - key: CORS_ORIGINS
        value: https://www.blieve.in,https://blieve.in,http://localhost:3000
